# SearXNG settings for MiniSearch.
#
# Built on top of SearXNG's upstream defaults via `use_default_settings`, so this
# file only declares what MiniSearch overrides:
#   - a placeholder secret_key
#   - JSON output format (consumed by server/webSearchService.ts)
#   - Mojeek switched on for text search
#
# Docs: https://docs.searxng.org/admin/settings/settings_use_default_settings.html
use_default_settings: true

server:
  # Placeholder replaced with a random value at image build time (see Dockerfile).
  secret_key: "ultrasecretkey"

search:
  formats:
    - json

engines:
  # Upstream ships Mojeek `inactive: true`, which only `inactive: false` undoes
  # (`disabled: false` leaves it unloaded). It runs its own index, so its
  # results are mostly ones the other engines do not return, and it keeps
  # answering where DuckDuckGo shows a CAPTCHA. See docs/configuration.md,
  # "Tuning the Search Engines".
  - name: mojeek
    inactive: false
