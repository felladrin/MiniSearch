name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, CalVer YYYY.M.D (e.g. 2026.9.15). A second release on the same day adds a sequence starting at 1: 2026.9.15.1, then .2, .3. Leave empty to auto-compute today's date (UTC) and the next free sequence."
        required: false
        default: ""
        type: string

# The duplicate check runs before the build, so a concurrent dispatch of the
# same version would pass it and only collide minutes later, on the tag push,
# with the Docker tag already published. Serializing dispatches makes the
# second run read the first run's tag and fail before it builds anything.
concurrency:
  group: publish-docker-image
  cancel-in-progress: false

jobs:
  build:
    name: Build and push the Docker image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    # This job never writes to the repository. Everything that runs between
    # the checkout and the image push - the Docker build, and the npm install
    # inside the Dockerfile - holds the job token, so that token is scoped to
    # read. The tag push and the GitHub Release live in the `release` job,
    # which is the only job with `contents: write`.
    permissions:
      contents: read
      packages: write
    outputs:
      # The release job publishes exactly this version rather than deriving
      # its own: re-running it cannot pick a version other than the one whose
      # image was just built, and it never re-runs the duplicate-tag guard
      # that would (correctly) reject a version this run already pushed.
      version: ${{ steps.validate-version.outputs.version }}
      # The commit the image was built from. The release job checks this out
      # by SHA instead of resolving the branch again, so a re-run tags the
      # commit that was released even if the default branch has moved on.
      commit: ${{ steps.record-commit.outputs.sha }}
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate the release version
        id: validate-version
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Empty input means "release today": compute the bare date in UTC,
          # then walk the same-day sequence until a slot has no git tag. The
          # runners are already UTC, but pinning TZ keeps the pattern
          # deterministic and fork-neutral: every instance cuts the same day
          # from the same clock. A tag lookup that is neither "exists" nor
          # "absent" aborts the loop: treating a failed lookup as "absent"
          # could hand out a version that is already published. The GitHub
          # Release check below still gates the computed value, so a tag-less
          # Release collision fails here with the "use a sequence" hint.
          if [[ -z $VERSION ]]; then
            base=$(TZ=UTC date +'%Y.%-m.%-d')
            VERSION=$base
            seq=1
            while :; do
              lookup_status=0
              git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null || lookup_status=$?
              case $lookup_status in
                0) VERSION="$base.$seq"; seq=$((seq + 1)) ;;
                2) break ;;
                *)
                  echo "Could not check whether git tag '$VERSION' exists: git ls-remote exited $lookup_status." >&2
                  exit 1
                  ;;
              esac
            done
            echo "No version input; auto-computed '$VERSION'."
          fi

          # CalVer: YYYY.M.D, with an optional same-day sequence that starts at 1.
          # The bare date is the first release of the day; ".0" and a zero-padded
          # month or day are rejected, so a given date has exactly one spelling
          # and the duplicate check below cannot be walked around with `2026.09.15`.
          # `[[ =~ ]]` anchors the whole value: `grep` matches line by line, so a
          # multi-line input whose first line is a valid version would pass and
          # then add a line of its own to the Docker `tags:` list.
          version_pattern='^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(\.[1-9][0-9]*)?$'
          if [[ ! $VERSION =~ $version_pattern ]]; then
            echo "Version '$VERSION' is not CalVer YYYY.M.D or YYYY.M.D.N (N >= 1, no zero padding)." >&2
            exit 1
          fi

          # A Release cut from a side branch is listed as the latest release and
          # its generated notes are diffed against a tag from another line of
          # history. This is the gate; the `enable={{is_default_branch}}` guard on
          # the `latest` Docker tag below is the backstop behind it.
          if [[ $REF_NAME != "$DEFAULT_BRANCH" ]]; then
            echo "Releases are cut from '$DEFAULT_BRANCH' only; this run is on '$REF_NAME'." >&2
            exit 1
          fi

          # Fail before any push: a duplicate must never move an already-published
          # Docker tag. `git ls-remote --exit-code` exits 0 when the tag exists and
          # 2 when it is absent. Any other status is a failed lookup, not an
          # absent tag, and must not be read as permission to release.
          tag_lookup_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null || tag_lookup_status=$?
          case $tag_lookup_status in
            0)
              # The tag can exist because a previous run pushed it and then
              # failed before publishing the GitHub Release. That release no
              # longer needs this job: the `release` job downstream is
              # idempotent and finishes it against the tag that is already
              # there, without rebuilding the image. Spending a sequence
              # number on an image that is complete except for its notes
              # would waste the version. A genuinely new same-day release
              # still takes the sequence.
              echo "Git tag '$VERSION' already exists, so this version was already published." >&2
              echo "If the GitHub Release is missing, re-run only the 'Tag the release and publish the GitHub Release' job of the run that pushed the tag; it is idempotent and will not rebuild." >&2
              echo "For a new same-day release, use a sequence (e.g. $VERSION.1)." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Could not check whether git tag '$VERSION' exists: git ls-remote exited $tag_lookup_status." >&2
              exit 1
              ;;
          esac

          # Secondary guard, best-effort by construction: `gh release view` exits
          # 1 both for a missing release and for a failed lookup, so it cannot be
          # told apart the way the tag check can. Its stderr is left visible so
          # the log shows which of the two happened.
          if gh release view "$VERSION" >/dev/null; then
            echo "GitHub Release '$VERSION' already exists. Use a sequence (e.g. $VERSION.1) for a same-day release." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Record the commit being released
        id: record-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` replaces the `main` tag this action emits by default. With
          # releases cut on demand, the image can sit several commits behind the
          # branch, so naming it after the branch misleads. The
          # `is_default_branch` guard is a backstop: the validation step already
          # refuses a dispatch from a side branch, and this keeps `latest` from
          # moving for everyone if that step is ever relaxed.
          #
          # This list is parsed one directive per line, so `version` is spliced
          # in only after the step above has checked it against an anchored
          # pattern; a value carrying a newline would otherwise add a directive.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.validate-version.outputs.version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build and push Docker Image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # BuildKit pushes these attestations with the registry credentials
          # already in use, so no extra job permissions are needed.
          provenance: mode=max
          sbom: true
  release:
    name: Tag the release and publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes to the repository, and only once the image is
    # already in the registry. Keeping the write scope here is the whole point
    # of the split: nothing that runs during the build can reach it.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
      # The commit the build job validated and built. The tag has to name it,
      # so it is both what gets checked out and what the push is verified
      # against.
      EXPECTED_SHA: ${{ needs.build.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          # Pin the checkout to the built commit rather than letting the
          # branch resolve again. A re-run of this job must publish against
          # the commit the image came from, whatever `main` points at by then.
          ref: ${{ needs.build.outputs.commit }}
      - name: Push the release tag
        run: |
          # This job is the recovery path for a half-finished release, so it
          # is written to be re-run on its own: the version comes from the
          # build job's output and is deliberately not re-validated here. The
          # duplicate-tag guard belongs to the build job, where failing early
          # saves a build; here a tag that already exists is the expected
          # state of a retry, not a reason to stop.
          if [[ -z $VERSION || -z $EXPECTED_SHA ]]; then
            echo "The build job produced no version or commit; refusing to tag or release." >&2
            exit 1
          fi
          echo "Publishing $VERSION from image digest ${DIGEST:-unknown}."

          # The tag is what ties the published image back to source, so it
          # must name the commit the image was built from. The checkout above
          # asks for that commit by SHA; this confirms it is what landed
          # before anything is pushed under that name.
          head_sha=$(git rev-parse HEAD)
          if [[ $head_sha != "$EXPECTED_SHA" ]]; then
            echo "Checked out $head_sha, but this run is for $EXPECTED_SHA; refusing to tag." >&2
            exit 1
          fi

          # Both the bare ref and the peeled `^{}` ref are requested in one
          # lookup. An annotated tag's bare ref names the tag object, so only
          # the peeled entry names the commit; a lightweight tag has no
          # peeled entry and its bare ref is already the commit. `--exit-code`
          # keeps the lookup three-valued: 0 exists, 2 absent, anything else a
          # failed lookup that must not be read as "absent".
          lookup_status=0
          remote_refs=$(git ls-remote --exit-code origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}") || lookup_status=$?
          case $lookup_status in
            0)
              tag_commit=$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/$VERSION^{}" '$2 == ref { print $1; exit }')
              if [[ -z $tag_commit ]]; then
                tag_commit=$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/$VERSION" '$2 == ref { print $1; exit }')
              fi
              if [[ -z $tag_commit ]]; then
                # The ref matched but neither form resolved to an object: the
                # remote said something this script cannot interpret, so it
                # must not push over it.
                echo "Git tag '$VERSION' exists but could not be resolved to a commit; refusing to touch it." >&2
                exit 1
              elif [[ $tag_commit == "$head_sha" ]]; then
                # A previous attempt got this far. Nothing to do, and nothing
                # to undo: continue on to the Release, which is the step that
                # is likely still missing.
                echo "Git tag '$VERSION' already points at $head_sha; nothing to push."
              else
                # The version belongs to other code. Moving a published tag
                # would silently re-point a released version at a different
                # build, so this stops rather than forcing.
                echo "Git tag '$VERSION' already points at $tag_commit, not $head_sha." >&2
                echo "Refusing to move a published tag. Use a same-day sequence (e.g. $VERSION.1)." >&2
                exit 1
              fi
              ;;
            2)
              git tag "$VERSION"
              git push origin "$VERSION"
              echo "Pushed git tag '$VERSION' at $head_sha."
              ;;
            *)
              echo "Could not check whether git tag '$VERSION' exists: git ls-remote exited $lookup_status." >&2
              exit 1
              ;;
          esac
      - name: Publish the GitHub Release
        run: |
          # Create the Release only when it is missing, so a repair run of
          # this job is safe: if a previous attempt pushed the tag and then
          # failed at `gh release create`, re-running the job must not die
          # on "already exists". `gh release view` exits non-zero for a
          # missing Release and for a failed lookup alike, so a failed
          # lookup falls through to create: a loud create failure beats
          # silently skipping a Release that was never made.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release '$VERSION' already exists; skipping creation."
          else
            gh release create "$VERSION" --generate-notes --title "$VERSION"
          fi
