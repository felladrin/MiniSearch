name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, CalVer YYYY.M.D (e.g. 2026.9.15). A second release on the same day adds a sequence starting at 1: 2026.9.15.1, then .2, .3."
        required: true
        type: string

jobs:
  build-and-push-image:
    name: Publish Docker Image to GitHub Packages
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate the release version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # CalVer: YYYY.M.D, with an optional same-day sequence that starts at 1.
          # The bare date is the first release of the day; ".0" is rejected so the
          # first release has exactly one spelling. See README "Releases".
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[1-9][0-9]*)?$'; then
            echo "Version '$VERSION' is not CalVer YYYY.M.D or YYYY.M.D.N (N >= 1)." >&2
            exit 1
          fi

          # Fail before any push: a duplicate must never move an already-published
          # Docker tag. git ls-remote exits 0 when the tag exists, 2 when absent.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Git tag '$VERSION' already exists. Use a sequence (e.g. $VERSION.1) for a same-day release." >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release '$VERSION' already exists. Use a sequence (e.g. $VERSION.1) for a same-day release." >&2
            exit 1
          fi
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` replaces the `main` tag this action emits by default. With
          # releases cut on demand, the image can sit several commits behind the
          # branch, so naming it after the branch misleads. The
          # `is_default_branch` guard stops a dispatch from a side branch from
          # moving the tag for everyone.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4
      - name: Build and push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # BuildKit pushes these attestations with the registry credentials
          # already in use, so no extra job permissions are needed.
          provenance: mode=max
          sbom: true
      - name: Tag the release and publish the GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --generate-notes --title "$VERSION"
